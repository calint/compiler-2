WarningsAsErrors: '*'
Checks:
  - '*'
  # used in visit variant code
  - '-misc-multiple-inheritance'
  # altera specific for hardware
  - '-altera-*'
  # it is ok with lsp
  - '-bugprone-easily-swappable-parameters'
  # dereferencing std::optional is ok
  - '-bugprone-optional-value-conversion'
  # some cases have great use of it
  - '-fuchsia-default-arguments-calls'
  # default arguments are useful in the cases used
  - '-fuchsia-default-arguments-declarations'
  # used in visit variant code
  - '-fuchsia-multiple-inheritance'
  # trailing returns preferred
  - '-fuchsia-trailing-return'
  # some cases have great use of it
  - '-google-default-arguments'
  # pragma once preferred
  - '-llvm-header-guard'
  # recommendations are anonymous namespace rather
  - '-llvm-prefer-static-over-anonymous-namespace'
  # relevant to libc developer
  - '-llvmlibc-*'
  # reports public fields in structs also
  - '-misc-non-private-member-variables-in-classes'
  # recursion is often more readable
  - '-misc-no-recursion'
  # pragma once preferred
  - '-portability-avoid-pragma-once'
  # some few functions are better big and complex
  - '-readability-function-cognitive-complexity'
  # the smaller the context the less length, 1 or 2 letters many times ok
  - '-readability-identifier-length'
  # does not allow construct such as if (counter++) due to implicit conversion to bool
  - '-readability-implicit-bool-conversion'
  # false positives on asserts that cannot be static assert
  - '-cert-dcl03-c'
  # false positives on asserts that cannot be static assert
  - '-hicpp-static-assert'
  # false positives on asserts that cannot be static assert
  - '-misc-static-assert'
  # all initialization done with braces
  - '-clang-diagnostic-braced-scalar-init'
  # allow making everything that can be const
  - '-readability-avoid-const-params-in-decls'
  # it is incredibly slow, consumes 99.9 % of user time
  - '-bugprone-exception-escape'
